services:
  # Redis for BullMQ Background Workers & Multi-Layer Caching
  redis:
    image: redis:alpine
    container_name: store4riders-redis
    restart: unless-stopped
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch for Instant Autocomplete & Typo-Tolerant Search
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: store4riders-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY:-store4riders_master_key_123}
      - MEILI_ENV=${MEILISEARCH_ENV:-development}
    ports:
      - "${MEILI_BIND_IP:-127.0.0.1}:7700:7700"
    volumes:
      - meilisearch_data:/meili_data

volumes:
  redis_data:
  meilisearch_data:
