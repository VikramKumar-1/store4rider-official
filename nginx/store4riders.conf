# ==============================================================================
# Store4Riders - Dual-IP Production Nginx Reverse Proxy Configuration
# Architecture:
# - IP 1: Public Storefront (store4riders.com / www.store4riders.com)
#         Blocks /admin with 404 to hide admin existence from public internet
# - IP 2: Admin Panel (admin.store4riders.com) -> Proxies to Next.js :3000
# - IP 2: Backend REST API (api.store4riders.com) -> Proxies to Next.js API :4000
#         Includes full Server-Sent Events (SSE) support for admin live stream
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. DROP DIRECT IP SCANNERS
# Drops any request that hits the raw IP without a recognized Host header
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444; # Closes connection immediately without response
}

# ------------------------------------------------------------------------------
# 1. PUBLIC STOREFRONT (BIND STRICTLY TO IP 1)
# Replace <YOUR_IP_1> with your storefront IP (e.g. 62.222.11.222)
# ------------------------------------------------------------------------------
server {
    listen <YOUR_IP_1>:80;
    server_name store4riders.com www.store4riders.com;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strict defense-in-depth: block any access to /admin on public storefront IP
    location /admin {
        return 404;
    }
}

# ------------------------------------------------------------------------------
# 2. ADMIN PANEL (BIND STRICTLY TO IP 2)
# Replace <YOUR_IP_2> with your admin IP (e.g. 21.222.11.222)
# ------------------------------------------------------------------------------
server {
    listen <YOUR_IP_2>:80;
    server_name admin.store4riders.com;

    # Optional: Restrict to office/VPN IPs for extreme security
    # allow 103.xxx.xxx.xxx;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 3. BACKEND REST API & WEBHOOKS (BIND STRICTLY TO IP 2)
# Replace <YOUR_IP_2> with your backend IP (e.g. 21.222.11.222)
# ------------------------------------------------------------------------------
server {
    listen <YOUR_IP_2>:80;
    server_name api.store4riders.com;

    client_max_body_size 50M; # For catalog CSV uploads

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Admin Live Stream) & Long-polling support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
