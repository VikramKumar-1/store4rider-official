name: Store4Riders Monorepo CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: 🔍 TypeScript & Lint Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Frontend
        run: pnpm --filter frontend exec tsc --noEmit

      - name: Typecheck Backend
        run: pnpm --filter backend exec tsc --noEmit

  test:
    name: 🧪 Vitest Suite (Unit & Edge-Case Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run All Vitest Suites (Monorepo Turborepo)
        run: pnpm test

  build:
    name: 🏗️ Production Build Verification
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.store4riders.com/api/v1
      DATABASE_URL: mongodb://localhost:27017/store4riders_ci
      JWT_SECRET: test_ci_jwt_secret_key_minimum_32_characters_long_12345
      REDIS_URL: redis://localhost:6379
      PAYU_KEY: ci_payu_key
      PAYU_SALT: ci_payu_salt
      CCAVENUE_MERCHANT_ID: ci_ccavenue_merchant
      CCAVENUE_ACCESS_CODE: ci_ccavenue_code
      CCAVENUE_WORKING_KEY: ci_ccavenue_key
      SNAPMINT_KEY: ci_snapmint_key
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Packages
        run: pnpm turbo run build --filter="@store4riders/*"

      - name: Build Next.js Apps (Backend & Frontend)
        run: pnpm build
